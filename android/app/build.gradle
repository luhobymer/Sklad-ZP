apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    // За замовчуванням debug-варіанти НЕ бандляться з JS-бандлом.
    // Щоб змусити плагін збирати JS у debug-APK (потрібно для офлайн-тесту без Metro),
    // очищаємо список debuggableVariants, тим самим вимикаючи пропуск бандлінгу для debug.
    debuggableVariants = []

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.gorun4.skladzp"
    defaultConfig {
        applicationId "com.gorun4.skladzp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    // Generate per-ABI APKs to reduce size for distribution (e.g., Telegram's 50MB limit)
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk false
        }
        // Density splits are not necessary; keep assets unified
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:flipper-integration")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

// Ensure react-native-vector-icons fonts are bundled into the APK
project.ext.vectoricons = [
    iconFontNames: [
        'MaterialCommunityIcons.ttf',
        'MaterialIcons.ttf',
        'Ionicons.ttf'
    ]
]
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

// ---- Auto-send APK to Telegram after build (debug/release) ----
// Requires environment variables:
//   TG_BOT_TOKEN - Telegram bot token
//   TG_CHAT_ID   - Telegram chat id (e.g., -4695077697)
// Uses PowerShell script at scripts/send-telegram.ps1
afterEvaluate {
    // Enable hook only when explicitly requested: -Papk.telegram.enabled=true
    def hookEnabled = (project.hasProperty('apk.telegram.enabled') && project.property('apk.telegram.enabled')?.toString()?.toBoolean())
    if (!hookEnabled) {
        logger.lifecycle("[apk-telegram] Hook disabled (enable with -Papk.telegram.enabled=true)")
        return
    }
    // Read from ENV or -P project properties
    def tgToken = System.getenv('TG_BOT_TOKEN') ?: (project.hasProperty('tg.bot.token') ? project.property('tg.bot.token') : null)
    def tgChat  = System.getenv('TG_CHAT_ID')   ?: (project.hasProperty('tg.chat.id')   ? project.property('tg.chat.id')   : null)
    def psScript = new File(rootDir, 'scripts/send-telegram.ps1')

    if (tgToken == null || tgToken.trim().isEmpty() || tgChat == null || tgChat.trim().isEmpty() || !psScript.exists()) {
        logger.lifecycle("[apk-telegram] Skipped auto-send: env/token/chat/script not set. TG_BOT_TOKEN and TG_CHAT_ID required. Script exists: ${psScript.exists()}")
        return
    }

    android.applicationVariants.all { variant ->
        // Trigger after assemble task completes
        if (variant.hasProperty('assembleProvider')) {
            // Clean old APKs before build to avoid sending stale files
            variant.assembleProvider.get().doFirst {
                try {
                    def apkDir = new File(buildDir, "outputs/apk/${variant.name}")
                    if (apkDir.exists()) {
                        logger.lifecycle("[apk-telegram] Cleaning old APKs in ${apkDir}")
                        apkDir.listFiles(new FilenameFilter() {
                            boolean accept(File dir, String name) { return name.endsWith(".apk") }
                        })?.each { it.delete() }
                    }
                } catch (Exception ex) {
                    logger.warn("[apk-telegram] Clean old APKs failed: ${ex.message}")
                }
            }
            variant.assembleProvider.get().doLast {
                try {
                    def apkDir = new File(buildDir, "outputs/apk/${variant.name}")
                    if (!apkDir.exists()) {
                        logger.lifecycle("[apk-telegram] APK dir not found: ${apkDir}")
                        return
                    }
                    // Prefer split APKs like app-armeabi-v7a-debug.apk
                    def apkFiles = apkDir.listFiles(new FilenameFilter() {
                        boolean accept(File dir, String name) {
                            return name.endsWith("-${variant.name}.apk") || name.endsWith(".apk")
                        }
                    })?.findAll { it.isFile() }
                    if (!apkFiles || apkFiles.isEmpty()) {
                        logger.lifecycle("[apk-telegram] No APK files in ${apkDir}")
                        return
                    }
                    // Prefer the newest arm64-v8a if present, else newest overall
                    def arm64List = apkFiles.findAll { it.name.contains('arm64-v8a') }
                    def selected = null
                    if (arm64List && !arm64List.isEmpty()) {
                        selected = arm64List.max { it.lastModified() }
                    } else {
                        selected = apkFiles.max { it.lastModified() }
                    }
                    logger.lifecycle("[apk-telegram] Sending ${selected.name} (${Math.round(selected.length()/1024/1024)} MB) to Telegram chat ${tgChat}")

                    def result = exec {
                        ignoreExitValue true
                        commandLine 'powershell', '-NoLogo', '-NoProfile', '-File', psScript.absolutePath,
                                '-Token', tgToken,
                                '-Chat', tgChat,
                                '-ApkPath', selected.absolutePath
                    }
                    if (result.exitValue != 0) {
                        logger.warn("[apk-telegram] Send script exited with code ${result.exitValue} (build will not fail)")
                    }
                } catch (Exception ex) {
                    logger.warn("[apk-telegram] Send failed: ${ex.message}")
                }
            }
        }
    }
}
